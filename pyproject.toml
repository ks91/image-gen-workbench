[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gen-workbench"
version = "0.1.0"
description = "A local Qwen image generation and editing studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "Pillow>=11,<13", "filelock>=3.16,<4"]

[project.optional-dependencies]
model = ["torch>=2.10,<3", "diffusers>=0.42.1,<0.43", "transformers>=5.22.1,<6", "accelerate>=1,<2", "safetensors>=0.6", "sentencepiece>=0.2"]

[project.scripts]
image-gen-workbench = "image_gen_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["image_gen_workbench*"]

[tool.setuptools.package-data]
image_gen_workbench = ["templates/*.html", "static/*.css", "static/*.js", "static/*.json"]
